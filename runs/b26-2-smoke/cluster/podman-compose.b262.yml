# Cluster Infinispan, 3 nós, para experimentação local.
# B-26.2 smoke: podman-compose -p b262 -f podman-compose.b262.yml up -d (portas 12262..12264)
#
# Imagem oficial: quay.io/infinispan/server
# Porta Hot Rod: 11222
# Porta gerenciamento (REST/Console): 11222 (mesma; protocolos co-existem)
# A rede 'infinispan-net' é criada automaticamente por podman-compose.
#
# Para reproduzir cenários de falha (F1 crash, F3 latência), use os scripts em
# scripts/. Cenários F2 (partição) e F4 (state transfer) são opcionais em TCC-I.

version: "3.8"

networks:
  infinispan-net:
    driver: bridge

services:
  isn1:
    image: quay.io/infinispan/server:15.0.21.Final
    container_name: b262-isn1
    hostname: isn1
    command: ["-c", "infinispan.xml", "-Dinfinispan.hotrod.external-port=12262"]
    environment:
      - USER=admin
      - PASS=infinispan
      - INFINISPAN_CLUSTER_NAME=cluster-tcc
    volumes:
      - ./infinispan-cluster.xml:/opt/infinispan/server/conf/infinispan.xml:ro
      - ./jgroups-tcp.xml:/opt/infinispan/server/conf/jgroups-tcp.xml:ro
    ports:
      - "12262:11222"
    networks:
      - infinispan-net
    healthcheck:
      test: ["CMD", "curl", "-f", "--digest", "-u", "admin:infinispan", "http://localhost:11222/rest/v2/cache-managers/default/health/status"]
      interval: 5s
      timeout: 3s
      retries: 20

  isn2:
    image: quay.io/infinispan/server:15.0.21.Final
    container_name: b262-isn2
    hostname: isn2
    command: ["-c", "infinispan.xml", "-Dinfinispan.hotrod.external-port=12263"]
    environment:
      - USER=admin
      - PASS=infinispan
      - INFINISPAN_CLUSTER_NAME=cluster-tcc
    volumes:
      - ./infinispan-cluster.xml:/opt/infinispan/server/conf/infinispan.xml:ro
      - ./jgroups-tcp.xml:/opt/infinispan/server/conf/jgroups-tcp.xml:ro
    ports:
      - "12263:11222"
    networks:
      - infinispan-net
    healthcheck:
      test: ["CMD", "curl", "-f", "--digest", "-u", "admin:infinispan", "http://localhost:11222/rest/v2/cache-managers/default/health/status"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      - isn1

  isn3:
    image: quay.io/infinispan/server:15.0.21.Final
    container_name: b262-isn3
    hostname: isn3
    command: ["-c", "infinispan.xml", "-Dinfinispan.hotrod.external-port=12264"]
    environment:
      - USER=admin
      - PASS=infinispan
      - INFINISPAN_CLUSTER_NAME=cluster-tcc
    volumes:
      - ./infinispan-cluster.xml:/opt/infinispan/server/conf/infinispan.xml:ro
      - ./jgroups-tcp.xml:/opt/infinispan/server/conf/jgroups-tcp.xml:ro
    ports:
      - "12264:11222"
    networks:
      - infinispan-net
    healthcheck:
      test: ["CMD", "curl", "-f", "--digest", "-u", "admin:infinispan", "http://localhost:11222/rest/v2/cache-managers/default/health/status"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      - isn1
