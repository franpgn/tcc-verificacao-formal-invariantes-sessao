# A4 (06/11): copia de cluster/podman-compose-sem-caches.yml com nomes a4-*, rede a4-net e portas 12901-12903 (projeto Podman proprio a4).
# A4: logging k8s-file (arquivo por conteiner) em vez do journald padrao da maquina do Podman: a recusa do cache ignorado
# grava um ERROR com pilha (ISPN005003) por pedido, e no journald isso estoura o limite de taxa do podman.service,
# que entao descarta linhas de TODOS os conteineres (inclusive os de outros projetos). So o destino do log muda.
# W-6 (B-46): igual ao podman-compose.yml, mas cada no monta o infinispan-sem-caches.xml (nenhum cache no XML;
# os seis caches sao criados pela REST por scripts/cria-caches.sh). ClusterSemCachesXmlTest confere que so o
# volume do XML muda. Usado por scripts/run-campanha-s3.sh na recriacao do cluster antes de cada execucao.
# Cluster Infinispan, 3 nós, para experimentação local.
# Uso: podman-compose -f podman-compose.yml up -d
#
# Imagem oficial: quay.io/infinispan/server
# Porta Hot Rod: 11222
# Porta gerenciamento (REST/Console): 11222 (mesma; protocolos co-existem)
# A rede 'a4-net' é criada automaticamente por podman-compose.
#
# Para reproduzir cenários de falha (F1 crash, F3 latência), use os scripts em
# scripts/. Cenários F2 (partição) e F4 (state transfer) são opcionais em TCC-I.

version: "3.8"

networks:
  a4-net:
    driver: bridge

services:
  isn1:
    image: quay.io/infinispan/server:15.0.21.Final
    container_name: a4-isn1
    hostname: isn1
    command: ["-c", "infinispan.xml", "-Dinfinispan.hotrod.external-port=12901"]
    environment:
      - USER=admin
      - PASS=infinispan
      - INFINISPAN_CLUSTER_NAME=cluster-tcc
    volumes:
      - ./infinispan-sem-caches.xml:/opt/infinispan/server/conf/infinispan.xml:ro
      - ./jgroups-tcp.xml:/opt/infinispan/server/conf/jgroups-tcp.xml:ro
    ports:
      - "12901:11222"
    networks:
      - a4-net
    logging:
      driver: k8s-file
    healthcheck:
      test: ["CMD", "curl", "-f", "--digest", "-u", "admin:infinispan", "http://localhost:11222/rest/v2/cache-managers/default/health/status"]
      interval: 5s
      timeout: 3s
      retries: 20

  isn2:
    image: quay.io/infinispan/server:15.0.21.Final
    container_name: a4-isn2
    hostname: isn2
    command: ["-c", "infinispan.xml", "-Dinfinispan.hotrod.external-port=12902"]
    environment:
      - USER=admin
      - PASS=infinispan
      - INFINISPAN_CLUSTER_NAME=cluster-tcc
    volumes:
      - ./infinispan-sem-caches.xml:/opt/infinispan/server/conf/infinispan.xml:ro
      - ./jgroups-tcp.xml:/opt/infinispan/server/conf/jgroups-tcp.xml:ro
    ports:
      - "12902:11222"
    networks:
      - a4-net
    logging:
      driver: k8s-file
    healthcheck:
      test: ["CMD", "curl", "-f", "--digest", "-u", "admin:infinispan", "http://localhost:11222/rest/v2/cache-managers/default/health/status"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      - isn1

  isn3:
    image: quay.io/infinispan/server:15.0.21.Final
    container_name: a4-isn3
    hostname: isn3
    command: ["-c", "infinispan.xml", "-Dinfinispan.hotrod.external-port=12903"]
    environment:
      - USER=admin
      - PASS=infinispan
      - INFINISPAN_CLUSTER_NAME=cluster-tcc
    volumes:
      - ./infinispan-sem-caches.xml:/opt/infinispan/server/conf/infinispan.xml:ro
      - ./jgroups-tcp.xml:/opt/infinispan/server/conf/jgroups-tcp.xml:ro
    ports:
      - "12903:11222"
    networks:
      - a4-net
    logging:
      driver: k8s-file
    healthcheck:
      test: ["CMD", "curl", "-f", "--digest", "-u", "admin:infinispan", "http://localhost:11222/rest/v2/cache-managers/default/health/status"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      - isn1
