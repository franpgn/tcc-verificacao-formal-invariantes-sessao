# B-44.3: cluster local de 3 nos, projeto b443 (REST/Hot Rod 12444..12446, diag 12447..12449).
# Pilha JGroups montada: jgroups-tcp.xml
version: "3.8"
networks:
  infinispan-net:
    driver: bridge
services:
  isn1:
    image: quay.io/infinispan/server:15.0.21.Final
    container_name: b443-isn1
    hostname: isn1
    command: ["-c", "infinispan.xml", "-Dinfinispan.hotrod.external-port=12444"]
    environment:
      - USER=admin
      - PASS=infinispan
      - INFINISPAN_CLUSTER_NAME=cluster-tcc
    volumes:
      - ./infinispan-cluster.xml:/opt/infinispan/server/conf/infinispan.xml:ro
      - ./jgroups-tcp.xml:/opt/infinispan/server/conf/jgroups-tcp.xml:ro
    ports:
      - "12444:11222"
      - "12447:7500"
    networks:
      - infinispan-net
  isn2:
    image: quay.io/infinispan/server:15.0.21.Final
    container_name: b443-isn2
    hostname: isn2
    command: ["-c", "infinispan.xml", "-Dinfinispan.hotrod.external-port=12445"]
    environment:
      - USER=admin
      - PASS=infinispan
      - INFINISPAN_CLUSTER_NAME=cluster-tcc
    volumes:
      - ./infinispan-cluster.xml:/opt/infinispan/server/conf/infinispan.xml:ro
      - ./jgroups-tcp.xml:/opt/infinispan/server/conf/jgroups-tcp.xml:ro
    ports:
      - "12445:11222"
      - "12448:7500"
    networks:
      - infinispan-net
  isn3:
    image: quay.io/infinispan/server:15.0.21.Final
    container_name: b443-isn3
    hostname: isn3
    command: ["-c", "infinispan.xml", "-Dinfinispan.hotrod.external-port=12446"]
    environment:
      - USER=admin
      - PASS=infinispan
      - INFINISPAN_CLUSTER_NAME=cluster-tcc
    volumes:
      - ./infinispan-cluster.xml:/opt/infinispan/server/conf/infinispan.xml:ro
      - ./jgroups-tcp.xml:/opt/infinispan/server/conf/jgroups-tcp.xml:ro
    ports:
      - "12446:11222"
      - "12449:7500"
    networks:
      - infinispan-net
