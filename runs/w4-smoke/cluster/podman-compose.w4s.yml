# W-4 smoke (V-W4 secao 9): copia de cluster/podman-compose.yml com nomes w4s-* e portas 12611-12613 (projeto proprio).
# Cluster Infinispan, 3 nós, para experimentação local.
# Uso: podman-compose -f podman-compose.yml up -d
#
# Imagem oficial: quay.io/infinispan/server
# Porta Hot Rod: 11222
# Porta gerenciamento (REST/Console): 11222 (mesma; protocolos co-existem)
# A rede 'w4s-net' é criada automaticamente por podman-compose.
#
# Para reproduzir cenários de falha (F1 crash, F3 latência), use os scripts em
# scripts/. Cenários F2 (partição) e F4 (state transfer) são opcionais em TCC-I.

version: "3.8"

networks:
  w4s-net:
    driver: bridge

services:
  isn1:
    image: quay.io/infinispan/server:15.0.21.Final
    container_name: w4s-isn1
    hostname: isn1
    command: ["-c", "infinispan.xml", "-Dinfinispan.hotrod.external-port=12611"]
    environment:
      - USER=admin
      - PASS=infinispan
      - INFINISPAN_CLUSTER_NAME=cluster-tcc
    volumes:
      - ./infinispan-cluster.xml:/opt/infinispan/server/conf/infinispan.xml:ro
      - ./jgroups-tcp.xml:/opt/infinispan/server/conf/jgroups-tcp.xml:ro
    ports:
      - "12611:11222"
    networks:
      - w4s-net
    healthcheck:
      test: ["CMD", "curl", "-f", "--digest", "-u", "admin:infinispan", "http://localhost:11222/rest/v2/cache-managers/default/health/status"]
      interval: 5s
      timeout: 3s
      retries: 20

  isn2:
    image: quay.io/infinispan/server:15.0.21.Final
    container_name: w4s-isn2
    hostname: isn2
    command: ["-c", "infinispan.xml", "-Dinfinispan.hotrod.external-port=12612"]
    environment:
      - USER=admin
      - PASS=infinispan
      - INFINISPAN_CLUSTER_NAME=cluster-tcc
    volumes:
      - ./infinispan-cluster.xml:/opt/infinispan/server/conf/infinispan.xml:ro
      - ./jgroups-tcp.xml:/opt/infinispan/server/conf/jgroups-tcp.xml:ro
    ports:
      - "12612:11222"
    networks:
      - w4s-net
    healthcheck:
      test: ["CMD", "curl", "-f", "--digest", "-u", "admin:infinispan", "http://localhost:11222/rest/v2/cache-managers/default/health/status"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      - isn1

  isn3:
    image: quay.io/infinispan/server:15.0.21.Final
    container_name: w4s-isn3
    hostname: isn3
    command: ["-c", "infinispan.xml", "-Dinfinispan.hotrod.external-port=12613"]
    environment:
      - USER=admin
      - PASS=infinispan
      - INFINISPAN_CLUSTER_NAME=cluster-tcc
    volumes:
      - ./infinispan-cluster.xml:/opt/infinispan/server/conf/infinispan.xml:ro
      - ./jgroups-tcp.xml:/opt/infinispan/server/conf/jgroups-tcp.xml:ro
    ports:
      - "12613:11222"
    networks:
      - w4s-net
    healthcheck:
      test: ["CMD", "curl", "-f", "--digest", "-u", "admin:infinispan", "http://localhost:11222/rest/v2/cache-managers/default/health/status"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      - isn1
